<script>
  const CHANNEL_URL = "https://api.thingspeak.com/channels/3272717/feeds.json?results=100";

  const smokeThreshold = 1800;
  const soundThreshold = 250;
  const tempThreshold = 35;
  const humidityThreshold = 75;

  let tempGaugeChart;
  let humGaugeChart;
  let smokeGaugeChart;
  let soundGaugeChart;

  function safeNumber(value) {
    const num = parseFloat(value);
    return isNaN(num) ? null : num;
  }

  function setText(id, value) {
    document.getElementById(id).textContent = value;
  }

  function formatSaudiTime(dateString) {
    if (!dateString) return "--";

    const date = new Date(dateString);

    return date.toLocaleString("en-US", {
      timeZone: "Asia/Riyadh",
      year: "numeric",
      month: "short",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    });
  }

  function getGaugeColor(value, warning, danger) {
    if (value >= danger) return "#ef4444";
    if (value >= warning) return "#f59e0b";
    return "#22c55e";
  }

  function createGauge(canvasId, currentValue, maxValue, warning, danger, color) {
    const ctx = document.getElementById(canvasId).getContext("2d");

    return new Chart(ctx, {
      type: "doughnut",
      data: {
        datasets: [{
          data: [currentValue, Math.max(maxValue - currentValue, 0)],
          backgroundColor: [color, "#243247"],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        rotation: 270,
        circumference: 180,
        cutout: "72%",
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false }
        }
      }
    });
  }

  function updateGauge(chart, currentValue, maxValue, color) {
    chart.data.datasets[0].data = [currentValue, Math.max(maxValue - currentValue, 0)];
    chart.data.datasets[0].backgroundColor = [color, "#243247"];
    chart.update();
  }

  function initGauges() {
    tempGaugeChart = createGauge("tempGauge", 0, 60, 30, 35, "#22c55e");
    humGaugeChart = createGauge("humGauge", 0, 100, 60, 75, "#22c55e");
    smokeGaugeChart = createGauge("smokeGauge", 0, 3000, 1500, 1800, "#22c55e");
    soundGaugeChart = createGauge("soundGauge", 0, 600, 180, 250, "#22c55e");
  }

  function isAlertFeed(feed) {
    const temp = safeNumber(feed.field1);
    const hum = safeNumber(feed.field2);
    const smoke = safeNumber(feed.field6);
    const sound = safeNumber(feed.field7);

    return (
      (smoke !== null && smoke > smokeThreshold) ||
      (sound !== null && sound > soundThreshold) ||
      (temp !== null && temp > tempThreshold) ||
      (hum !== null && hum > humidityThreshold)
    );
  }

  function findLastAlertFeed(feeds) {
    for (let i = feeds.length - 1; i >= 0; i--) {
      if (isAlertFeed(feeds[i])) {
        return feeds[i];
      }
    }
    return null;
  }

  function updateStatus(temp, hum, smoke, sound, latestTime, lastAlertTime) {
    const statusText = document.getElementById("statusText");
    const statusDesc = document.getElementById("statusDesc");
    const statusIndicator = document.getElementById("statusIndicator");

    let state = "NORMAL";
    let desc = "All monitored parameters are within the configured thresholds.";
    let cls = "status-indicator status-normal";

    if (smoke !== null && smoke > smokeThreshold) {
      state = "SMOKE ALARM";
      desc = "MQ-2 smoke level exceeded the configured threshold.";
      cls = "status-indicator status-warning";
    } else if (sound !== null && sound > soundThreshold) {
      state = "SOUND ALERT";
      desc = "Sound level exceeded the configured threshold.";
      cls = "status-indicator status-warning";
    } else if (temp !== null && temp > tempThreshold) {
      state = "HIGH TEMPERATURE";
      desc = "Temperature is above the recommended threshold.";
      cls = "status-indicator status-caution";
    } else if (hum !== null && hum > humidityThreshold) {
      state = "HIGH HUMIDITY";
      desc = "Humidity level is above the recommended threshold.";
      cls = "status-indicator status-caution";
    }

    statusText.textContent = state;
    statusDesc.innerHTML =
      desc +
      "<br><br><b>Latest Update:</b> " + latestTime +
      "<br><b>Last Sensor Detection:</b> " + lastAlertTime;

    statusIndicator.className = cls;
    statusIndicator.textContent = state === "NORMAL" ? "OK" : "ALERT";
  }

  async function loadLatestData() {
    try {
      const response = await fetch(CHANNEL_URL, { cache: "no-store" });
      const data = await response.json();

      const feeds = data.feeds || [];
      const latest = feeds[feeds.length - 1];

      if (!latest) {
        throw new Error("No ThingSpeak data found.");
      }

      const temp = safeNumber(latest.field1);
      const hum = safeNumber(latest.field2);
      const smoke = safeNumber(latest.field6);
      const sound = safeNumber(latest.field7);

      const latestTime = formatSaudiTime(latest.created_at);

      const lastAlertFeed = findLastAlertFeed(feeds);
      const lastAlertTime = lastAlertFeed
        ? formatSaudiTime(lastAlertFeed.created_at)
        : "No alert detected in latest 100 records";

      setText("tempValue", temp !== null ? temp.toFixed(2) + " °C" : "--");
      setText("humValue", hum !== null ? hum.toFixed(2) + " %" : "--");
      setText("smokeValue", smoke !== null ? Math.round(smoke) : "--");
      setText("soundValue", sound !== null ? Math.round(sound) : "--");

      setText("tempGaugeText", temp !== null ? temp.toFixed(1) : "--");
      setText("humGaugeText", hum !== null ? hum.toFixed(1) : "--");
      setText("smokeGaugeText", smoke !== null ? Math.round(smoke) : "--");
      setText("soundGaugeText", sound !== null ? Math.round(sound) : "--");

      updateStatus(temp, hum, smoke, sound, latestTime, lastAlertTime);

      if (temp !== null) {
        updateGauge(tempGaugeChart, Math.min(temp, 60), 60, getGaugeColor(temp, 30, 35));
      }

      if (hum !== null) {
        updateGauge(humGaugeChart, Math.min(hum, 100), 100, getGaugeColor(hum, 60, 75));
      }

      if (smoke !== null) {
        updateGauge(smokeGaugeChart, Math.min(smoke, 3000), 3000, getGaugeColor(smoke, 1500, 1800));
      }

      if (sound !== null) {
        updateGauge(soundGaugeChart, Math.min(sound, 600), 600, getGaugeColor(sound, 180, 250));
      }

    } catch (error) {
      setText("statusText", "DATA ERROR");
      setText("statusDesc", "Unable to retrieve the latest feed from ThingSpeak.");

      const statusIndicator = document.getElementById("statusIndicator");
      statusIndicator.className = "status-indicator status-warning";
      statusIndicator.textContent = "ERR";
    }
  }

  initGauges();
  loadLatestData();
  setInterval(loadLatestData, 10000);
</script>
